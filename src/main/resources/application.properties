spring.application.name=weatherpick

server.port=443
server.ssl.enabled=true
server.ssl.key-store=/etc/ssl/certificate.pfx
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=1

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.url=${DB_URL}

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.jpa.hibernate.ddl-auto=update

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

naver.client.id=${NAVER_CLIENT_ID}
naver.client.secret=${NAVER_CLIENT_SECRET}

file.path = C:/weatherpick/uploadfile/
file.url = http://localhost:8080/file/

spring.cloud.aws.region=ap-northeast-2
spring.cloud.aws.access-key=${AWS_ACCESS_KEY}
spring.cloud.aws.secret-key=${AWS_SECRET_KEY}
spring.cloud.aws.s3.bucket=${AWS_S3_BUCKET}